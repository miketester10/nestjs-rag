services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    ports:
      - 11434:11434           # porta di default Ollama
    volumes:
      - ./data:/root/.ollama  # persistenza modelli e configurazioni
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    restart: always
    tty: true
